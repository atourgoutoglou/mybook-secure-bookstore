# ---------------------------------------------------------------------------
# Apache hardening used for MyBook (XAMPP on Windows, Apache 2.4.58, PHP 8.2)
# These are excerpts — paths reflect the local development setup.
# ---------------------------------------------------------------------------

# --- httpd-vhosts.conf: force HTTPS (HTTP -> HTTPS 301 redirect) -----------
<VirtualHost *:80>
    ServerName localhost
    DocumentRoot "C:/xampp/htdocs/BookStoreApp"
    <Directory "C:/xampp/htdocs/BookStoreApp">
        RewriteEngine On
        RewriteCond %{HTTPS} off
        RewriteRule ^(.*)$ https://%{HTTP_HOST}/BookStoreApp/$1 [R=301,L]
    </Directory>
</VirtualHost>

# --- httpd-ssl.conf: TLS certificate chain + security headers --------------
<VirtualHost _default_:443>
    # Server certificate signed by a private Intermediate CA (Root CA -> Intermediate CA -> server)
    SSLCertificateFile      "conf/ssl.crt/server.cert.pem"
    SSLCertificateKeyFile   "conf/ssl.key/server.key.pem"
    SSLCertificateChainFile "conf/ssl.crt/ca-chain.cert.pem"

    # HTTP security headers (added after the OWASP ZAP scan)
    Header always set Content-Security-Policy "default-src 'self'; script-src 'self' https://unpkg.com; style-src 'self' https://unpkg.com; font-src 'self' https://unpkg.com data:; img-src 'self' data:;"
    Header always set X-Frame-Options "DENY"
    Header always set X-Content-Type-Options "nosniff"
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
</VirtualHost>

# --- httpd.conf: hide Apache version information ---------------------------
ServerSignature Off
ServerTokens Prod

# --- php.ini: hide PHP version (removes the X-Powered-By header) -----------
# expose_php = Off

# --- BookStoreApp/.htaccess: disable directory listing ----------------------
# Options -Indexes
